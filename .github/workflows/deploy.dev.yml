name: Deploy development

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Không huỷ deploy đang chạy: ngắt SSH giữa chừng để lại container dở dang.
concurrency:
  group: ag-farm-dev-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST_DEV }}
      VPS_USER: ${{ secrets.VPS_USER_DEV }}
      VPS_PORT: ${{ secrets.VPS_PORT_DEV || '22' }}
      APP_PATH: ${{ secrets.FARM_APP_PATH_DEV || '/www/wwwroot/dev/ag-farm' }}
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY_DEV }}

      - name: Deploy via SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            sudo git config --global --add safe.directory '$APP_PATH'
            cd '$APP_PATH'
            sudo git pull --ff-only origin main
            TAG=\$(sudo git rev-parse --short HEAD)
            sudo env TAG=\$TAG bash ./deploy.sh
          "
