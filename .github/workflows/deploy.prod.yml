name: Deploy production

# Prod chạy trên VPS riêng, chỉ deploy khi bấm tay (Actions → Deploy production → Run workflow, chọn main).
# Commit được deploy là đúng commit của lần chạy này (github.sha), không phải main mới nhất lúc SSH.
on:
  workflow_dispatch:

# Không huỷ deploy đang chạy: ngắt SSH giữa chừng để lại container dở dang.
concurrency:
  group: ag-farm-prod-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Đặt "Required reviewers" cho environment này nếu muốn duyệt trước khi deploy.
    environment:
      name: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST_PROD }}
      VPS_USER: ${{ secrets.VPS_USER_PROD }}
      VPS_PORT: ${{ secrets.VPS_PORT_PROD || '22' }}
      APP_PATH: ${{ secrets.FARM_APP_PATH_PROD || '/www/wwwroot/prod/ag-farm' }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY_PROD }}

      - name: Deploy via SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            sudo git config --global --add safe.directory '$APP_PATH'
            cd '$APP_PATH'
            sudo git fetch origin main
            sudo git merge --ff-only '$COMMIT'
            TAG=\$(sudo git rev-parse --short HEAD)
            sudo env TAG=\$TAG bash ./deploy.sh
          "
